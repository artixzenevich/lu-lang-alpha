[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lu-lang"
version = "0.4.1-alpha"
description = "Детский язык программирования на русском поверх Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Education",
]
dependencies = [
    "lark-parser>=0.12.0",
]

[project.scripts]
lu = "lulang.cli:main"

[tool.setuptools.packages.find]
include = ["lulang*"]

[tool.setuptools.package-data]
lulang = ["библиотеки/*.lu", "библиотеки/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]