[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lu-lang"
version = "0.1.0-alpha"
description = "Детский язык программирования на русском поверх Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = [
    "lark-parser>=0.12.0",
]

[project.scripts]
lu = "lulang.cli:main"

[tool.setuptools.packages.find]
include = ["lulang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]